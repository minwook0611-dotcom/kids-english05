name: kids-english-bot
on:
  workflow_dispatch:        # 깃허브에서 수동 실행(테스트) 버튼
permissions:
  contents: write           # ★ sent_words.json 을 리포에 커밋하기 위해 필요
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install openai requests
      - name: Send daily kids english
        run: python kids_english_bot.py
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save word history        # ★ 오늘 보낸 단어 목록을 리포에 저장(커밋)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_words.json
          git commit -m "chore: update sent_words [skip ci]" || echo "변경 없음, 건너뜀"
          git push
